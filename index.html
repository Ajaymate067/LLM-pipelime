<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VECTORVERSE — Inside the Mind of an LLM</title>
    <meta name="description" content="Interactive AI laboratory visualizing tokens, embeddings, 3D PCA projection, cosine similarity, and semantic search in real-time." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root">
      <div id="loader-fallback" class="min-h-screen flex flex-col items-center justify-center p-6 text-center font-mono">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 animate-pulse mb-4 flex items-center justify-center text-white text-xl">
          🌌
        </div>
        <h2 class="text-xl font-bold text-cyan-400 mb-2">VECTORVERSE</h2>
        <p class="text-xs text-slate-400 max-w-md mb-4">
          Loading AI Laboratory & Latent Vector Space...
        </p>
        <noscript>
          <p class="text-xs text-amber-400 bg-amber-950/60 p-3 rounded border border-amber-500/30">
            JavaScript is required to run Vectorverse. Please enable JavaScript in your browser.
          </p>
        </noscript>
      </div>
    </div>

    <!-- Automatic static Live Server detection & redirection -->
    <script>
      (function() {
        const isViteDev = window.location.port === '5173' || window.location.port === '5174';
        // If served via VS Code Live Server (port 5500, 5501, 8080, etc.) or file://, forward to precompiled dist
        if (!isViteDev && (window.location.port === '5500' || window.location.port === '5501' || window.location.protocol === 'file:')) {
          if (!window.location.pathname.includes('/dist/')) {
            window.location.replace('./dist/index.html' + window.location.search + window.location.hash);
          }
        }
      })();

      // Catch module load errors (e.g. static server trying to load unbundled .tsx)
      window.addEventListener('error', function(event) {
        if (event.filename && event.filename.endsWith('.tsx')) {
          console.warn('Static server cannot execute .tsx directly. Loading compiled production build...');
          window.location.replace('./dist/index.html');
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
